<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    width: 1080px;
    height: 1920px;
    background: linear-gradient(180deg, #faf9f6 0%, #f5f3ee 100%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1a1a1a;
    padding: 100px 45px 80px;
    overflow: hidden;
}
.header { text-align: center; margin-bottom: 40px; }
.date { font-size: 36px; color: #666; margin-bottom: 12px; letter-spacing: 4px; }
.title {
    font-size: 72px; font-weight: 800;
    background: linear-gradient(90deg, #d4af37, #b8860b, #d4af37);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 6px;
}
.section {
    background: #fff; border-radius: 20px;
    padding: 30px 35px; margin-bottom: 28px;
    border: 2px solid #d4af37;
    box-shadow: 0 4px 24px rgba(212,175,55,0.15);
}
.section-title {
    font-size: 38px; color: #b8860b;
    margin-bottom: 20px; padding-bottom: 14px;
    border-bottom: 2px solid #d4af37; font-weight: 700;
}
.flow-header {
    display: flex; align-items: center;
    padding: 16px 22px; background: rgba(212,175,55,0.08);
    border-radius: 10px; margin-bottom: 12px;
    border: 1px solid #e8e4d9;
}
.flow-header .flow-rank,
.flow-header .flow-name,
.flow-header .flow-change,
.flow-header .flow-value {
    font-size: 28px; color: #b8860b; font-weight: 600;
}
.flow-row {
    display: flex; align-items: center;
    padding: 16px 22px; background: #faf9f6;
    border-radius: 10px; margin-bottom: 12px;
    border: 1px solid #e8e4d9;
}
.flow-rank { font-size: 36px; font-weight: 800; color: #b8860b; width: 50px; }
.flow-name { font-size: 34px; font-weight: 600; color: #1a1a1a; flex: 1; }
.flow-change { font-size: 34px; font-weight: 700; width: 130px; text-align: right; }
.flow-value { font-size: 36px; font-weight: 800; width: 150px; text-align: right; }
.footer { text-align: center; margin-top: 24px; font-size: 26px; color: #999; }
</style>
</head>
<body>
    <div class="header">
        <div class="date">2026年09月21日</div>
        <div class="title">概念板块表现</div>
    </div>
    <div class="section">
        <div class="section-title">💰 净流入排行（亿元）</div>
        <div class="flow-header">
            <div class="flow-rank">排名</div>
            <div class="flow-name">概念名称</div>
            <div class="flow-change">涨跌幅</div>
            <div class="flow-value">净流入</div>
        </div>
        <div class="flow-row"><div class="flow-rank">1</div><div class="flow-name">创新药</div><div class="flow-change" style="color:#dc143c">+4.27%</div><div class="flow-value" style="color:#dc143c">73.4亿</div></div>
        <div class="flow-row"><div class="flow-rank">2</div><div class="flow-name">智能医疗</div><div class="flow-change" style="color:#dc143c">+2.79%</div><div class="flow-value" style="color:#dc143c">42.4亿</div></div>
        <div class="flow-row"><div class="flow-rank">3</div><div class="flow-name">医药电商</div><div class="flow-change" style="color:#dc143c">+3.59%</div><div class="flow-value" style="color:#dc143c">35.5亿</div></div>
        <div class="flow-row"><div class="flow-rank">4</div><div class="flow-name">仿制药一致性评价</div><div class="flow-change" style="color:#dc143c">+4.08%</div><div class="flow-value" style="color:#dc143c">35.2亿</div></div>
        <div class="flow-row"><div class="flow-rank">5</div><div class="flow-name">物业管理</div><div class="flow-change" style="color:#dc143c">+3.05%</div><div class="flow-value" style="color:#dc143c">32.1亿</div></div>
        <div class="flow-row"><div class="flow-rank">6</div><div class="flow-name">流感</div><div class="flow-change" style="color:#dc143c">+4.13%</div><div class="flow-value" style="color:#dc143c">31.8亿</div></div>
        <div class="flow-row"><div class="flow-rank">7</div><div class="flow-name">减肥药</div><div class="flow-change" style="color:#dc143c">+4.44%</div><div class="flow-value" style="color:#dc143c">26.5亿</div></div>
        <div class="flow-row"><div class="flow-rank">8</div><div class="flow-name">细胞免疫治疗</div><div class="flow-change" style="color:#dc143c">+4.89%</div><div class="flow-value" style="color:#dc143c">24.5亿</div></div>
        <div class="flow-row"><div class="flow-rank">9</div><div class="flow-name">养老概念</div><div class="flow-change" style="color:#dc143c">+3.06%</div><div class="flow-value" style="color:#dc143c">23.6亿</div></div>
        <div class="flow-row"><div class="flow-rank">10</div><div class="flow-name">肝炎概念</div><div class="flow-change" style="color:#dc143c">+4.14%</div><div class="flow-value" style="color:#dc143c">23.6亿</div></div>
    </div>
    <div class="footer">数据来源：同花顺概念板块 | 仅供参考，不构成投资建议</div>
</body>
</html>
