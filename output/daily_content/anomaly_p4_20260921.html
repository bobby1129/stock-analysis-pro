<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    width: 1080px; height: 1920px;
    background: linear-gradient(180deg, #faf9f6 0%, #f5f3ee 100%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1a1a1a;
    padding: 100px 45px 80px;
    overflow: hidden;
}
.header { text-align: center; margin-bottom: 50px; }
.date { font-size: 40px; color: #666; margin-bottom: 16px; letter-spacing: 4px; }
.title {
    font-size: 80px; font-weight: 800;
    background: linear-gradient(90deg, #d4af37, #b8860b, #d4af37);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 6px;
}
.section {
    background: #fff; border-radius: 24px;
    padding: 40px 40px; margin-bottom: 30px;
    border: 2px solid #d4af37;
    box-shadow: 0 4px 24px rgba(212,175,55,0.15);
}
.section-title {
    font-size: 48px; color: #b8860b;
    margin-bottom: 28px; padding-bottom: 18px;
    border-bottom: 2px solid #d4af37; font-weight: 700;
}
.lb-item {
    display: flex; align-items: center;
    padding: 26px 26px; background: #faf9f6;
    border-radius: 12px; margin-bottom: 16px;
    border: 1px solid #e8e4d9;
}
.lb-level { font-size: 48px; font-weight: 800; color: #b8860b; width: 120px; }
.lb-count { font-size: 42px; color: #dc143c; font-weight: 700; width: 100px; text-align: center; }
.lb-names { font-size: 36px; color: #333; flex: 1; }
.footer { text-align: center; margin-top: 30px; font-size: 28px; color: #999; }
</style></head><body>
<div class="header">
    <div class="date">2026年09月21日</div>
    <div class="title">异常信号捕捉</div>
</div>
<div class="section">
    <div class="section-title">🔥 连板梯队</div>
    <div class="lb-item"><div class="lb-level">5板</div><div class="lb-count">1家</div><div class="lb-names">华瓷股份</div></div>
    <div class="lb-item"><div class="lb-level">4板</div><div class="lb-count">1家</div><div class="lb-names">内蒙新华</div></div>
    <div class="lb-item"><div class="lb-level">3板</div><div class="lb-count">4家</div><div class="lb-names">南华生物、龙头股份、华软科技、华纺股份</div></div>
    <div class="lb-item"><div class="lb-level">2板</div><div class="lb-count">7家</div><div class="lb-names">马矿股份、大亚圣象、诚邦股份、新华文轩、百通能源等7家</div></div>
    <div class="lb-item"><div class="lb-level">1板</div><div class="lb-count">17家</div><div class="lb-names">华媒控股、华远控股、华锡有色、新华传媒、奥佳华等17家</div></div>
</div>
<div class="footer">数据来源：沪深A股 | 仅供参考，不构成投资建议</div>
</body></html>
